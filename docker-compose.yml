services:
  sniper:
    build: .
    image: vinted-sniper:latest
    container_name: vinted-sniper
    restart: unless-stopped
    env_file: .env
    volumes:
      # Benanntes Volume statt Bind-Mount auf ./data: Docker übernimmt dabei
      # Besitzer und Rechte aus dem Image, das Verzeichnis gehört also dem
      # Benutzer `sniper`. Ein Bind-Mount auf einen noch nicht existierenden
      # Ordner würde Docker als root anlegen — der Container könnte die
      # Datenbank dann nicht schreiben.
      - sniper-data:/app/data
      # Suchen für den Webhook-Modus. Die Datei muss existieren, bevor du
      # startest — sonst legt Docker an der Stelle ein Verzeichnis an:
      #   cp searches.example.toml searches.toml
      - ./searches.toml:/app/searches.toml:ro
      # Kaufprofile: was ein Fund einbringen muss, um gemeldet zu werden.
      # Muss existieren, bevor du startest — sonst legt Docker an der Stelle
      # ein Verzeichnis an:
      #   cp profiles.example.toml profiles.toml
      - ./profiles.toml:/app/profiles.toml:ro
      # Proxy-Liste. Muss ebenfalls existieren, bevor du startest:
      #   touch proxies.txt
      - ./proxies.txt:/app/proxies.txt:ro
    # Chromium braucht beim Fallback kurzzeitig spürbar Speicher.
    shm_size: 512mb
    # Nur an localhost gebunden: aus dem Internet ist das Panel so nicht
    # direkt erreichbar, ein Reverse-Proxy auf demselben Rechner aber schon.
    # Damit bleibt die Verbindung nach außen immer verschlüsselt.
    ports:
      - "127.0.0.1:${PANEL_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nur nötig, wenn auf dem Server noch kein Reverse-Proxy läuft. Starten mit:
  #   docker compose --profile standalone up -d
  # Läuft dort bereits Caddy, nginx oder Traefik, lass diesen Dienst aus und
  # trage stattdessen dort einen Block für PANEL_DOMAIN ein (siehe README).
  caddy:
    profiles: ["standalone"]
    image: caddy:2-alpine
    container_name: vinted-caddy
    restart: unless-stopped
    depends_on:
      - sniper
    environment:
      # Domain aus der .env — Caddy besorgt dafür automatisch ein Zertifikat.
      PANEL_DOMAIN: ${PANEL_DOMAIN:-vinted.example.de}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sniper-data:
  caddy-data:
  caddy-config:

networks:
  default:
    # Fester Name, damit ein bereits laufender Reverse-Proxy diesem Netz
    # beitreten und den Sniper unter `vinted-sniper:8080` erreichen kann:
    #   docker network connect vinted-sniper-net <name-des-proxy-containers>
    name: vinted-sniper-net
