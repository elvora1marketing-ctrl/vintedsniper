services:
  sniper:
    build: .
    image: vinted-sniper:latest
    container_name: vinted-sniper
    restart: unless-stopped
    env_file: .env
    volumes:
      # Benanntes Volume statt Bind-Mount auf ./data: Docker übernimmt dabei
      # Besitzer und Rechte aus dem Image, das Verzeichnis gehört also dem
      # Benutzer `sniper`. Ein Bind-Mount auf einen noch nicht existierenden
      # Ordner würde Docker als root anlegen — der Container könnte die
      # Datenbank dann nicht schreiben.
      - sniper-data:/app/data
      # Suchen für den Webhook-Modus. Die Datei muss existieren, bevor du
      # startest — sonst legt Docker an der Stelle ein Verzeichnis an:
      #   cp searches.example.toml searches.toml
      - ./searches.toml:/app/searches.toml:ro
      # Proxy-Liste. Muss ebenfalls existieren, bevor du startest:
      #   touch proxies.txt
      - ./proxies.txt:/app/proxies.txt:ro
    # Chromium braucht beim Fallback kurzzeitig spürbar Speicher.
    shm_size: 512mb
    # Kein Port nach außen: an das Panel kommt man nur über Caddy, damit die
    # Verbindung immer verschlüsselt ist.
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: vinted-caddy
    restart: unless-stopped
    depends_on:
      - sniper
    environment:
      # Domain aus der .env — Caddy besorgt dafür automatisch ein Zertifikat.
      PANEL_DOMAIN: ${PANEL_DOMAIN:?PANEL_DOMAIN fehlt in der .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sniper-data:
  caddy-data:
  caddy-config:
